<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laos Mission Dashboard</title>

    <!-- 1. Tailwind CSS (스타일링) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. React & ReactDOM & Lucide Icons (Import Map) -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
            "react/jsx-dev-runtime": "https://esm.sh/react@18.2.0/jsx-dev-runtime",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0"
        }
    }
    </script>

    <!-- 3. Babel (브라우저에서 JSX 실행) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 커스텀 스타일: 스크롤바 숨기기 및 애니메이션 */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- 로딩 표시 -->
    <div id="root" class="min-h-screen flex items-center justify-center text-gray-500 font-sans">
        <div class="text-center">
            <p class="text-lg mb-2">라오스 선교 대시보드 로딩 중...</p>
            <p class="text-xs text-gray-400">잠시만 기다려주세요</p>
        </div>
    </div>

    <!-- 4. React 컴포넌트 코드 -->
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import {

            CheckSquare, Navigation, Copy, ExternalLink, Church, RefreshCw,
            Sparkles, ShoppingBag, Ship, Loader, Phone, MessageCircle, Laptop
        } from 'lucide-react';

            const [dDay, setDDay] = useState('');
            const [mapUrl, setMapUrl] = useState('');
            const [activeRouteId, setActiveRouteId] = useState(0);

            // --------------------------------------------------------------------------
            // 데이터 섹션
            // --------------------------------------------------------------------------

            // 주요 장소 데이터
            const locations = [
                {
                    id: 'base',
                    type: '숙소',
                    name: "숙소",
                    korAddr: "비엔티안 시내",

                {

                    googleQuery: "309+Nongviangkham+Village,+Vientiane,+Laos",
                    icon: <Laptop className="w-5 h-5 text-indigo-600" />

                {
                    id: 'venuePM',
                    type: '저녁 교육장',

                    type: '공항',

                    origin: locations[0].googleQuery,
                    dest: locations[1].googleQuery,
                    icon: "💻",
                    desc: "8/31~9/2 오전반 이동"
                },
                {
                    id: 2,
                    name: "숙소 ↔ 저녁 교육장 (Ban Sapangmore)",

                    icon: "🌙",

                {
                    id: 3,
                    name: "숙소 ↔ 빠뚜사이 (개선문)",
                    origin: locations[0].googleQuery,
                    dest: "Patuxai,+Vientiane,+Laos",
                    icon: "🗼",
                    desc: "관광 참고 (9/3~9/4 추천)"
                },
                {
                    id: 4,
                    name: "숙소 ↔ 탓루앙 사원",
                    origin: locations[0].googleQuery,
                    dest: "Pha+That+Luang,+Vientiane,+Laos",
                    icon: "🛕",
                    desc: "관광 참고 (라오스 상징 사원)"
                },
                {
                    id: 5,
                    name: "숙소 ↔ 메콩강변",
                    origin: locations[0].googleQuery,
                    dest: "Mekong+Riverside,+Vientiane,+Laos",
                    icon: "🌅",
                    desc: "휴식 및 산책 (야시장/일몰)"
                },
            ];

            // 일정 데이터
            const scheduleData = [
                {
                    date: "8.30 (일)",
                    title: "출국 (인천 → 비엔티안)",
                    type: "travel",
                    items: [
                        "인천 출발 20:20 (제주항공 7C2401) 🛫",
                        "비엔티안(VTE) 도착 23:50",
                        "숙소 이동 및 취침"
                    ]
                },
                {
                    date: "8.31 (월)",
                    title: "AI 마스터클래스 Day1 - AI 기초 & 첫 번째 도구들",
                    type: "mission",
                    isKey: true,
                    items: [
                        "오전반 - Nongviangkham Village 💻",
                        "저녁반 - Ban Sapangmore 💻",
                        "AI 이해하기 - 개념 및 현장 활용",
                        "제미나이 사용하기 & 프롬프트 활용법",
                        "랜딩페이지 만들기 & 깃허브 배포",
                        "노트북LM 활용하기"
                    ]
                },
                {
                    date: "9.1 (화)",
                    title: "AI 마스터클래스 Day2 - 바이브 코딩 & 나만의 앱 만들기",
                    type: "mission",
                    isKey: true,
                    items: [
                        "오전반 - Nongviangkham Village 💻",
                        "저녁반 - Ban Sapangmore 💻",
                        "바이브 코딩이란 무엇인가",
                        "AI Studio로 앱 만들기",
                        "안티그래비티 / 클로드 코드 활용",
                        "나만의 홈페이지 만들기"
                    ]
                },
                {
                    date: "9.2 (수)",
                    title: "AI 마스터클래스 Day3 - 옵시디언으로 지식 창고 만들기",
                    type: "mission",
                    isKey: true,
                    items: [
                        "오전반 - Nongviangkham Village 💻",
                        "저녁반 - Ban Sapangmore 💻",
                        "마크다운 기초",
                        "볼트 구조 짜기 - 제텔카스텐 & PARA & CODE",
                        "생성형 AI와 함께 볼트 구조 짜기",
                        "옵시디언 설치 & 필수 템플릿 세팅",
                        "3일 교육 과정 수료"
                    ]
                },
                {
                    date: "9.3 (목)",
                    title: "휴식 및 관광",
                    type: "rest",
                    items: [
                        "오전 휴식",
                        "현지 관광 (빠뚜사이 / 탓루앙 등) 🚤",
                        "저녁 교제 및 나눔"
                    ]
                },
                {
                    date: "9.4 (금)",
                    title: "휴식 및 관광",
                    type: "rest",
                    items: [
                        "자유 일정 및 관광",
                        "짐 정리 및 사역 마무리 나눔"
                    ]
                },
                {
                    date: "9.5 (토)",
                    title: "귀국 (비엔티안 → 인천)",
                    type: "travel",
                    items: [
                        "비엔티안 출발 00:50 (제주항공 7C2402) ✈️",
                        "인천 도착 08:10 🏠",
                        "해산"
                    ]
                }
            ];

            // --------------------------------------------------------------------------
            // Hooks & Handlers
            // --------------------------------------------------------------------------

            useEffect(() => {
                const defaultRoute = routes[1];
                setMapUrl(`https://maps.google.com/maps?saddr=${defaultRoute.origin}&daddr=${defaultRoute.dest}&output=embed`);
                setActiveRouteId(1);
            }, []);

            useEffect(() => {
                const today = new Date();
                const tripDate = new Date('2026-08-30');
                const diffTime = tripDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                setDDay(diffDays > 0 ? `D-${diffDays}` : diffDays === 0 ? 'D-Day' : `D+${Math.abs(diffDays)}`);
            }, []);

            const handleCopyAddress = (text) => {
                try {
                    navigator.clipboard.writeText(text);
                    alert("주소가 복사되었습니다!");
                } catch (err) {
                    console.error('복사 실패:', err);
                    alert("주소 복사에 실패했습니다. 직접 복사해주세요.");
                }
            };

            const openGoogleMapsApp = (origin, dest) => {
                const url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving`;
                window.open(url, '_blank');
            };

            const showRouteOnMap = (routeId, origin, dest) => {
                setActiveRouteId(routeId);
                setMapUrl(`https://maps.google.com/maps?saddr=${origin}&daddr=${dest}&output=embed`);
            };

            const resetMapToBase = () => {
                setActiveRouteId('base');
                setMapUrl(`https://maps.google.com/maps?q=${locations[0].googleQuery}&t=&z=12&ie=UTF8&iwloc=&output=embed`);
            };

            // --------------------------------------------------------------------------
            // UI Render
            // --------------------------------------------------------------------------

            return (
                <div className="min-h-screen bg-gray-100 font-sans text-gray-800 pb-20 md:pb-10">

                    {/* Header Section */}
                    <div className="bg-blue-600 rounded-b-[2rem] pt-8 pb-16 px-6 text-white shadow-lg relative overflow-hidden">
                        <Plane className="absolute top-10 right-6 text-blue-500 opacity-30 w-24 h-24 transform rotate-12" />
                        <div className="relative z-10 max-w-md mx-auto">
                            <div className="inline-block bg-blue-500/50 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-semibold mb-3 border border-blue-400">
                                {dDay} Calculator
                            </div>
                            <h1 className="text-3xl font-bold mb-1 leading-tight">Laos AI Education Mission</h1>
                            <p className="text-blue-100 text-sm mb-1">2026 라오스 AI교육 단기선교 (8.30~9.5)</p>
                            <p className="text-blue-200 text-xs mb-6">"복음을 전하고 AI를 나눕니다" · 마 28:19</p>

                            <div className="bg-blue-700/50 backdrop-blur-md rounded-xl p-3 flex items-center">
                                <div className="bg-blue-500 p-2 rounded-full mr-3">
                                    <Users className="w-5 h-5 text-white" />
                                </div>
                                <div>
                                    <p className="text-xs text-blue-200">참여 인원</p>
                                    <p className="font-bold text-sm">김태주 · 이광복 목사 (총 2명)</p>
                                    <p className="text-[11px] text-blue-200 mt-0.5">온교회 김태주 목사 X 라온동행교회 이광복 목사</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Navigation Tabs */}
                    <div className="max-w-md mx-auto px-4 -mt-8 relative z-20">
                        <div className="flex justify-between space-x-2 overflow-x-auto pb-2 scrollbar-hide">
                            <button onClick={() => setActiveTab('schedule')} className={`flex-1 min-w-[80px] py-3 rounded-xl flex flex-col items-center justify-center shadow-sm text-xs font-bold transition-all ${activeTab === 'schedule' ? 'bg-white text-blue-600 ring-2 ring-blue-100' : 'bg-white/90 text-gray-400 hover:bg-white'}`}>
                                <Calendar className="w-5 h-5 mb-1" /> 일정표
                            </button>
                            <button onClick={() => setActiveTab('cityinfo')} className={`flex-1 min-w-[80px] py-3 rounded-xl flex flex-col items-center justify-center shadow-sm text-xs font-bold transition-all ${activeTab === 'cityinfo' ? 'bg-white text-blue-600 ring-2 ring-blue-100' : 'bg-white/90 text-gray-400 hover:bg-white'}`}>
                                <MapPin className="w-5 h-5 mb-1" /> 지도/동선
                            </button>
                            <button onClick={() => setActiveTab('cost')} className={`flex-1 min-w-[80px] py-3 rounded-xl flex flex-col items-center justify-center shadow-sm text-xs font-bold transition-all ${activeTab === 'cost' ? 'bg-white text-blue-600 ring-2 ring-blue-100' : 'bg-white/90 text-gray-400 hover:bg-white'}`}>
                                <Wallet className="w-5 h-5 mb-1" /> 예산
                            </button>
                            <button onClick={() => setActiveTab('check')} className={`flex-1 min-w-[80px] py-3 rounded-xl flex flex-col items-center justify-center shadow-sm text-xs font-bold transition-all ${activeTab === 'check' ? 'bg-white text-blue-600 ring-2 ring-blue-100' : 'bg-white/90 text-gray-400 hover:bg-white'}`}>
                                <CheckSquare className="w-5 h-5 mb-1" /> 준비물
                            </button>
                        </div>
                    </div>

                    {/* Content Area */}
                    <main className="max-w-md mx-auto px-4 mt-4 space-y-4">

                        {/* SCHEDULE TAB */}
                        {activeTab === 'schedule' && (
                            <div className="space-y-4 animate-fadeIn">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                    <h3 className="font-bold text-gray-800 mb-3 flex items-center">
                                        <Briefcase className="w-5 h-5 mr-2 text-blue-600" />
                                        주요 일정 요약
                                    </h3>
                                    <div className="space-y-3">
                                        <div className="bg-blue-50 p-3 rounded-xl">
                                            <div className="flex items-center">
                                                <div className="bg-blue-100 text-blue-600 font-bold px-2 py-1 rounded text-xs mr-3">8.31-9.2</div>
                                                <span className="text-sm font-medium text-gray-700">AI 마스터클래스 3일 교육 (09:00~15:00)</span>
                                            </div>
                                        </div>
                                        <div className="flex items-center bg-amber-50 p-3 rounded-xl">
                                            <div className="bg-amber-100 text-amber-600 font-bold px-2 py-1 rounded text-xs mr-3">9.3-9.4</div>
                                            <span className="text-sm font-medium text-gray-700">휴식 및 관광</span>
                                        </div>
                                    </div>
                                    <p className="text-[11px] text-gray-400 mt-3">※ 현지 교육 대상: 선착순 10명 소수정예 / 세부 커리큘럼은 현지 상황에 따라 변경될 수 있습니다.</p>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-2">
                                    {scheduleData.map((day, idx) => (
                                        <div key={idx} className={`p-4 ${idx !== scheduleData.length - 1 ? 'border-b border-gray-100' : ''}`}>
                                            <div className="flex justify-between items-center mb-2">
                                                <span className={`font-bold text-sm px-2 py-0.5 rounded-md ${day.isKey ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600'}`}>
                                                    {day.date}
                                                </span>
                                                {day.type === 'mission' && <span className="text-[10px] font-bold text-emerald-500">교육</span>}
                                                {day.type === 'travel' && <span className="text-[10px] font-bold text-amber-500">이동</span>}
                                                {day.type === 'rest' && <span className="text-[10px] font-bold text-purple-500">휴식</span>}

                        {activeTab === 'cityinfo' && (

                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

                                        <div className="absolute top-3 right-3 z-10 flex space-x-2">
                                            {activeRouteId !== 'base' && (
                                                <button onClick={resetMapToBase} className="bg-white text-gray-700 text-xs font-bold px-3 py-1.5 rounded-full shadow-md flex items-center border border-gray-200">
                                                    <RefreshCw className="w-3 h-3 mr-1" /> 비엔티안 전체보기
                                                </button>
                                            )}
                                        </div>
                                        <iframe width="100%" height="100%" style={{border:0}} loading="lazy" allowFullScreen referrerPolicy="no-referrer-when-downgrade" src={mapUrl} title="Accommodation Map"></iframe>
                                    </div>

                                    <div className="p-4 border-t border-gray-100">
                                        <div className="flex items-center justify-between mb-3">

                                                <Navigation className="w-5 h-5 mr-2 text-emerald-600" />

                                            </h3>
                                            <span className="text-[10px] text-gray-400">클릭하여 지도에 표시</span>
                                        </div>

                                        <div className="space-y-2">
                                            {routes.map((route) => (
                                                <div key={route.id} className={`rounded-xl border transition-all cursor-pointer p-3 ${activeRouteId === route.id ? 'border-emerald-500 bg-emerald-50 ring-1 ring-emerald-200' : 'border-gray-100 hover:border-emerald-200 hover:bg-gray-50'}`}>
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center flex-1" onClick={() => showRouteOnMap(route.id, route.origin, route.dest)}>
                                                            <span className="text-xl mr-3">{route.icon}</span>
                                                            <div>
                                                                <span className={`block text-sm font-bold ${activeRouteId === route.id ? 'text-emerald-800' : 'text-gray-700'}`}>
                                                                    {route.name}
                                                                </span>
                                                                <span className="block text-xs text-gray-500 mt-0.5">{route.desc}</span>
                                                            </div>
                                                        </div>
                                                        <button onClick={(e) => { e.stopPropagation(); openGoogleMapsApp(route.origin, route.dest); }} className="ml-2 p-2 text-gray-400 hover:text-emerald-600 hover:bg-emerald-100 rounded-full transition-colors" title="앱에서 열기">
                                                            <ExternalLink className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                    <div className="p-5 border-b border-gray-50">
                                        <h3 className="font-bold text-lg text-gray-800 flex items-center">
                                            <MapPin className="w-5 h-5 mr-2 text-blue-600" />
                                            주요 장소 상세 정보
                                        </h3>
                                    </div>
                                    <div className="divide-y divide-gray-50">
                                        {locations.map((loc, idx) => (

                                                        {loc.icon}
                                                        <span className="font-bold text-gray-800 ml-2">{loc.name}</span>
                                                    </div>
                                                    <span className={`text-[10px] px-2 py-1 rounded-full font-bold ${loc.type === '숙소' ? 'bg-blue-100 text-blue-600' : (loc.id === 'venueAM' || loc.id === 'venuePM') ? 'bg-indigo-100 text-indigo-600' : 'bg-amber-100 text-amber-700'}`}>
                                                        {loc.type}
                                                    </span>
                                                </div>
                                                <p className="text-xs text-gray-500 mb-2 ml-7 font-medium">{loc.korAddr}</p>
                                                <div className="ml-7">
                                                    <p className="text-xs text-gray-400 mb-2 leading-relaxed break-all bg-gray-50 p-2 rounded border border-gray-100">
